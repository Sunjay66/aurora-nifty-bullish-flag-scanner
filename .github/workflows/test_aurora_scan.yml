name: Aurora 3.1 - Test Scan

on:
  workflow_dispatch:

jobs:
  scan:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install yfinance pandas numpy

      - name: Run Aurora 3.1 scan
        run: |
          python scanner/daily_scan.py

      - name: Show generated files
        run: |
          echo "Generated files:"
          ls -lh data/active_flags.json
          ls -lh data/scan_summary.json

      - name: Upload scan results
        uses: actions/upload-artifact@v4
        with:
          name: aurora-scan-results
          path: |
            data/active_flags.json
            data/scan_summary.json
